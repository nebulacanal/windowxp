<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>7979 관리자</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #fafafa; color: #222; }
  .admin-wrap { max-width: 640px; margin: 0 auto; padding: 2rem 1.5rem; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .admin-header h1 { font-size: 20px; margin: 0; }
  .user-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.9rem 1rem; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 0.6rem; background: #fff;
  }
  .user-row .nickname { font-weight: 700; }
  .user-row .meta { font-size: 12px; color: #888; margin-top: 2px; }
  .btn-group { display: flex; gap: 6px; }
  .btn-approve, .btn-reject, .btn-back {
    border: none; border-radius: 8px; padding: 0.5rem 0.9rem; font-size: 13px; cursor: pointer;
  }
  .btn-approve { background: #4CAF50; color: #fff; }
  .btn-reject { background: #f44336; color: #fff; }
  .btn-back { background: #eee; color: #333; }
  .empty-note { color: #999; padding: 2rem 0; text-align: center; }
  .denied { text-align: center; padding: 4rem 1rem; }
  .section-title { font-size: 14px; color: #666; margin: 2rem 0 0.6rem; }
  .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .status-approved { background: #E6F4EA; color: #1E7E34; }
  .status-rejected { background: #FCE8E6; color: #B3261E; }
  .status-pending { background: #FFF4E5; color: #9A6700; }
</style>
</head>
<body>
<div class="admin-wrap" id="admin-wrap">
  <p>확인 중...</p>
</div>

<script src="/admin.js"></script>
</body>
</html>
